     <header>

        <h1>Oficina Mecânica</h1>
        <div class="div-header">
            <button><a href="index.html"><i class="fa-solid fa-arrow-right-from-bracket"></i>Sair
</a> </button>
            <img class="img-usuario"
                src="vetor-de-ícone-perfil-do-avatar-padrão-foto-usuário-mídia-social-183042379.webp" alt="Perfil">
            <p>Nome do usuário</p>
        </div>
    </header>
    <section class="nav-e-main">
        <nav>
            <ul>
               <li><a href="principal.html"><i class="fa-solid fa-house"></i> Menu</a></li>
                <li><a href="cadastrocliente.html"><i class="fa-solid fa-user"></i> Cadastro Clientes</a></li>

            </ul>
        </nav>
        <main>
            <h2>Cadastro de Agendamentos</h2>
            <form>
                <h3>Preencha as informações abaixo:</h3>

                <div class="inputgroup">
                    <label for="date"></label>
                    <div class="input-item">
                        <input id="data" type="date" placeholder="Data:">
                    </div>
                </div>
                <div class="inputgroup">
                    <label for="time"></label>
                    <div class="input-item">
                        <input id="hora" type="time" placeholder="Hora:">
                    </div>
                </div>
                <div class="inputgroup">
                    <label for="service"></label>
                    <div class="input-item">
                        <input id="serviço" type="text" placeholder="Serviço:">
                    </div>
                </div>
                <label for="Veiculo"></label>
                <div class="input-item">
                    <select id="Veiculo" name="Veiculo">
                        <option value="" selected>Selecione um veículo...</option>
                        <option value="veiculo1"> hatche Volks</option>
                        <option value="veiculo2">sedan Toyota</option>
                        <option value="veiculo3">picape	Hyundai </option>
                    </select>
                </div>
                <button class="btn-finalizar">Finalizar cadastro</button>
            </form>
        </main>
    </section>
