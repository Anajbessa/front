<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-Oficina mecânica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <form>
            <h1>Oficina Mecânica</h1>
            <h2>Login</h2>
            <div class="inputgroup">
                <label for="username"></label>
                <div class="input-item">
                <input id="username" type="text" placeholder="👤 Nome de usuario:">
                </div>
            </div>
            <div class="inputgroup">
                <label for="password"></label>
                <div class="input-item">
                    <input id="Senha" type="password" placeholder="🔒 Senha">
                </div>
            </div>
            <div class="buttons">
            <button class="btn-login"><a href="principal.html">Logar</a></button>
            <button class="btn-login"> <a href="principal.html">Criar conta</a></button>
            </div>
        </form>
    </main>
</body>
</html>
